<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Track A December 2023 holdout MAE by model</title>
  <desc id="description">Horizontal bar chart comparing seven models over 74,282 station-hour rows. Histogram Gradient Boosting with weather has the lowest MAE at 1.575.</desc>
  <rect width="1200" height="720" rx="28" fill="#071512"/>
