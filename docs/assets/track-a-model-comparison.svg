    <text x="64" y="384">Ridge · weather</text>
    <text x="64" y="454">HGB · no weather</text>
    <text x="64" y="524" fill="#efff19" font-weight="700">HGB · weather</text>
    <text x="64" y="594">XGBoost · weather</text>
  </g>

  <g fill="#18352e">
    <rect x="300" y="148" width="780" height="36" rx="8"/>
    <rect x="300" y="218" width="780" height="36" rx="8"/>
    <rect x="300" y="288" width="780" height="36" rx="8"/>
