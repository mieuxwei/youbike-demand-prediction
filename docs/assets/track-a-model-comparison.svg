  <g fill="#a8c8b4">
    <rect x="300" y="148" width="732" height="36" rx="8"/>
    <rect x="300" y="218" width="653" height="36" rx="8"/>
    <rect x="300" y="288" width="543" height="36" rx="8"/>
    <rect x="300" y="358" width="538" height="36" rx="8"/>
    <rect x="300" y="428" width="480" height="36" rx="8"/>
    <rect x="300" y="568" width="479" height="36" rx="8"/>
